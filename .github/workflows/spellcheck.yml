name: Spell Check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.txt"
      - "**.yml"
      - "**.yaml"
      - ".typos.toml"
  pull_request:
    paths:
      - "**.md"
      - "**.txt"
      - "**.yml"
      - "**.yaml"
      - ".typos.toml"

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Limit to human-written docs/config. Source and generated strings, plus
      # regex character classes in shell scripts, produce false positives.
      - name: Check spelling
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          config: .typos.toml
          files: |
            README.md
            README_ja.md
            ROADMAP.md
            CHECKLIST.md
            .github/CONTRIBUTING.md
            .github/CODE_OF_CONDUCT.md
            .github/SECURITY.md
            .github/SUPPORT.md
            docs
