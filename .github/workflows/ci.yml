name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: build/test only needs to read the repository contents.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ./SignalRouter.slnx

      - name: Test
        run: dotnet test ./SignalRouter.slnx --no-build

  # Release configuration: the allocation-measurement harness
  # (tests/SignalRouter.Performance.Tests) only reads representative
  # numbers from optimized code, and the exact-zero gates of the performance
  # track (docs plan P6) will run here. Debug jobs cannot serve that role.
  build-and-test-release:
    name: Build and test (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ./SignalRouter.slnx -c Release

      - name: Test
        run: dotnet test ./SignalRouter.slnx -c Release --no-build

  # The descriptor store applies owner-only permissions per OS (ADR 0008): Unix
  # 0700/0600 is covered by build-and-test on ubuntu, and this job covers the
  # Windows inheritance-disabled DACL path on a real Windows runner.
  build-and-test-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ./SignalRouter.slnx

      - name: Test
        run: dotnet test ./SignalRouter.slnx --no-build
